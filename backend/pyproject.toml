[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "ingest", "tests", "tests_acceptance"]

[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime"
ignore_missing_imports = true
